<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#03dbcc" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Long Cat Out! Arrow Puzzle</title>
  <!-- link previews in chats: a dare link (?c=) opens straight on the friend's board; static text, no server -->
  <meta name="author" content="Sher" />
  <meta name="description" content="A friend dared you on one exact board. Tap the long cats into their carriers, park the rest on five cushions, and beat their chain. Free in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Long Cat Out! Can you beat my chain?" />
  <meta property="og:description" content="A friend dared you on one exact board. Tap Play and try to beat their chain. Free in your browser, no sign-up." />
  <meta property="og:image" content="./icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700&display=swap" media="print" onload="this.media='all'" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9a8; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    :root { --vw: 100vw; }
    /* wide screens (desktop, landscape tablets): the game is a centred phone-shaped column; the room fills the sides.
       transform makes body the containing block for every position:fixed layer, so all UI stays inside the column. */
    @media (min-aspect-ratio: 2/3) {
      :root { --vw: min(100vw, calc(100dvh * 9 / 16)); }
      html { background: #5a3b22; }
      html::before { content: ''; position: fixed; inset: -40px; background: url(./assets/r7/bg_play_room.webp) center / cover; filter: blur(18px) brightness(.72) saturate(1.1); }
      body { position: relative; width: var(--vw); margin: 0 auto; transform: translateZ(0); box-shadow: 0 0 0 1px rgba(60,30,10,.35), 0 0 60px rgba(0,0,0,.45); }
    }
    /* R11 look: a real desktop (not a landscape phone) shows a painted cat street, sharp, with a light vignette; its
       time of day follows the chapter (--look-desk, src/ui/look-world.js). Only this rule names it, so phones never load it. */
    @media (min-aspect-ratio: 2/3) and (min-width: 900px) and (min-height: 560px) {
      html::before { inset: -4px; background: radial-gradient(ellipse 75% 85% at 50% 50%, transparent 55%, rgba(40,20,8,.38)), var(--look-desk, url(./assets/r7/look-desk-day.webp)) center / cover; background-color: #5a3b22; filter: blur(1.2px); }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
